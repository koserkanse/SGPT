version: 1.3.17
cache: true
copilot:
  enabled: true
  model: openai/gpt-4.1-mini
  apiKey: '${COPILOT_API_KEY}'
  generativeUI: true
  # Administrators can use Copilot. Explicitly grant other account IDs here.
  allowedUserIds: []
  requestsPerMinute: 20
  timeoutMs: 120000
  maxThreads: 100
  maxRunsPerThread: 20
  maxHistoryBytes: 20000000
  openDots:
    url: http://opendots:4310
    ownerUserId: '${OPENDOTS_OWNER_USER_ID}'
    token: '${OPENDOTS_OWNER_TOKEN}'
